[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neriplayer-win"
version = "0.2.0"
description = "NeriPlayer Windows 桌面客户端:网易云 + B站,扫码登录 / 歌单 / 播放"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0.7",
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "segno>=1.6.6",
]

[project.scripts]
neriplayer-win = "neriplayer_win.app:main"

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "nuitka>=4.2.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 关闭 pytest 自带的 faulthandler:libmpv(LuaJIT)在 Windows 上会周期性
# 抛出自定义 SEH 异常(0xE24C4A02)用于内部控制流,faulthandler 会把这类
# 本被自身处理器吞掉的异常打印成 "Windows fatal exception",且其过滤器
# 在异常处理中途于外来线程执行 Python 代码,偶发升级为进程级崩溃。
addopts = "-p no:faulthandler"
testpaths = ["tests"]
